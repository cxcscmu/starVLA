run_id: starvla_pi_v3_calvin_abc_d
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: cxcscmu
wandb_project: starvla_yd
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v3
  qwenvl:
    base_vlm: ./playground/Pretrained_models/InternVL3_5-1B
    attn_implementation: flash_attention_2
    # vl_hidden_dim auto-overridden at runtime (InternVL3.5-1B = 1024)
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 7
    state_dim: 7
    action_horizon: 8     # Calvin chunk = 8
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      # InternVL3.5-1B has vl_hidden=1024; setting dit_hidden=1024 makes
      # project_layers an Identity (zero extra params, max throughput).
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64
  reduce_in_full_precision: true

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    include_state: true              # PI_v3 uses discretised state in instructions
    data_root_dir: playground/Datasets/calvin
    data_mix: calvin_task_ABC_D
    action_type: delta_qpos
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 4
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  max_train_steps: 60000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
